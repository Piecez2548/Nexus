pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

// Auto-provision the JDK that Capacitor 8 plugins request via a strict
// toolchain (e.g. @capacitor/camera's `kotlin { jvmToolchain(21) }`). Without
// this, a machine that only has a newer JDK (Gradle matches toolchains by exact
// major version) fails with "Cannot find a Java installation matching
// languageVersion=21". The foojay resolver lets Gradle download the required
// JDK on demand, so the build works regardless of which JDK is installed.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
