<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <title>Select screen region</title>
  <style>
    :root { font-family: system-ui, "Segoe UI", sans-serif; color: #fff; background: rgba(10, 12, 16, .28); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; cursor: crosshair; user-select: none; }
    body { position: relative; }
    .toolbar { position: fixed; z-index: 2; top: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; padding: 12px 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 12px; background: rgba(18, 20, 26, .9); box-shadow: 0 10px 30px rgba(0,0,0,.25); cursor: default; }
    .toolbar strong, .toolbar span { display: block; white-space: nowrap; }
    .toolbar strong { font-size: 14px; }
    .toolbar span { margin-top: 3px; color: #bdc3ce; font-size: 12px; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; background: #fff; color: #14161b; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .selection { position: absolute; display: none; border: 2px solid #bfe39b; background: rgba(191, 227, 155, .08); box-shadow: 0 0 0 9999px rgba(10, 12, 16, .48), 0 0 24px rgba(191, 227, 155, .35); pointer-events: none; }
    .selection span { position: absolute; top: 6px; left: 6px; padding: 3px 6px; border-radius: 5px; background: #bfe39b; color: #162118; font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="toolbar"><div><strong>Select a screen region</strong><span>Drag around the content to read · Esc to cancel</span></div><button id="cancel" type="button">Cancel</button></div>
  <div id="selection" class="selection"><span></span></div>
  <script>
    const selection = document.getElementById("selection");
    const label = selection.querySelector("span");
    let start = null;

    function update(event) {
      if (!start) return;
      const x = Math.min(start.x, event.clientX);
      const y = Math.min(start.y, event.clientY);
      const width = Math.abs(event.clientX - start.x);
      const height = Math.abs(event.clientY - start.y);
      selection.style.display = "block";
      selection.style.left = `${x}px`;
      selection.style.top = `${y}px`;
      selection.style.width = `${width}px`;
      selection.style.height = `${height}px`;
      label.textContent = `${Math.round(width)} × ${Math.round(height)}`;
    }

    document.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      start = { x: event.clientX, y: event.clientY };
      selection.style.display = "none";
      document.body.setPointerCapture?.(event.pointerId);
    });
    document.addEventListener("pointermove", update);
    document.addEventListener("pointerup", (event) => {
      if (!start) return;
      update(event);
      const x = Math.min(start.x, event.clientX);
      const y = Math.min(start.y, event.clientY);
      const width = Math.abs(event.clientX - start.x);
      const height = Math.abs(event.clientY - start.y);
      start = null;
      if (width >= 40 && height >= 40) window.screenTutor.submitRegion({ x, y, width, height });
    });
    document.getElementById("cancel").addEventListener("click", () => window.screenTutor.cancelRegion());
    window.addEventListener("keydown", (event) => { if (event.key === "Escape") window.screenTutor.cancelRegion(); });
  </script>
</body>
</html>
