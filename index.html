<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScreenTutor" />
    <title>ScreenTutor — See. Understand. Learn.</title>
    <script>
      try {
        const savedTheme = JSON.parse(localStorage.getItem("nexus-app-settings") || "{}").state?.themeMode || "dark";
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = savedTheme === "dark" || (savedTheme === "system" && systemDark);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.classList.toggle("mono", savedTheme === "mono");
      } catch { document.documentElement.classList.add("dark"); }
    </script>
    <style id="entry-shell-style">
      .entry-shell{min-height:100svh;background:#f5f7f4;color:#1e2a23;font-family:system-ui,"Leelawadee UI",Tahoma,sans-serif;padding:0 20px;display:flex;flex-direction:column}
      .entry-shell__header{min-height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce4dd;font-size:14px}
      .entry-shell__brand{font-size:29px;font-weight:800;letter-spacing:-.04em}.entry-shell__brand span{color:#2d6a4f}
      .entry-shell__body{width:100%;max-width:480px;margin:auto;padding:32px 24px;border:1px solid #dce4dd;border-radius:14px;background:#fff}
      .entry-shell h1{margin:0;font-size:40px;line-height:1.25;font-weight:650;letter-spacing:-.03em}.entry-shell p{margin:12px 0 0;color:#718077;font-size:15px}
    </style>
  </head>
  <body>
    <div id="root"><main class="entry-shell" aria-busy="true"><header class="entry-shell__header"><div class="entry-shell__brand">ScreenTutor<span>.</span></div><span>Local-first learning</span></header><section class="entry-shell__body"><h1>See. Understand. Learn.</h1><p>Preparing your private workspace…</p></section></main></div>
    <script>
      try {
        const hasSavedSession = Object.keys(localStorage).some((key) => key.startsWith("sb-") && key.endsWith("-auth-token"));
        if (hasSavedSession) document.getElementById("root").replaceChildren();
      } catch { /* Keep the public shell when storage is unavailable. */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
