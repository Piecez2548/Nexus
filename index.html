<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <title>nexus</title>
    <style id="entry-shell-style">
      .entry-shell{min-height:100svh;background:#0c0b10;color:#f4f4f5;font-family:system-ui,"Leelawadee UI",Tahoma,sans-serif;padding:0 20px;display:flex;flex-direction:column}
      .entry-shell__header{min-height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #27242f;font-size:14px}
      .entry-shell__brand{font-size:29px;font-weight:800;letter-spacing:-.04em}.entry-shell__brand span{color:#a78bfa}
      .entry-shell__body{width:100%;max-width:480px;margin:auto;padding:32px 24px;border:1px solid #27242f;border-radius:14px;background:#17151d}
      .entry-shell h1{margin:0;font-size:40px;line-height:1.25;font-weight:650;letter-spacing:-.03em}.entry-shell p{margin:12px 0 0;color:#b9b4c5;font-size:15px}
    </style>
  </head>
  <body>
    <div id="root"><main class="entry-shell" aria-busy="true"><header class="entry-shell__header"><div class="entry-shell__brand">nexus<span>.</span></div><span>Nexus All</span></header><section class="entry-shell__body"><h1>พื้นที่ทำงานของคุณ</h1><p>กำลังเตรียมการเข้าสู่ Nexus อย่างปลอดภัย</p></section></main></div>
    <script>
      try {
        const hasSavedSession = Object.keys(localStorage).some((key) => key.startsWith("sb-") && key.endsWith("-auth-token"));
        if (hasSavedSession) document.getElementById("root").replaceChildren();
      } catch { /* Keep the public shell when storage is unavailable. */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
