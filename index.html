<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f4" />
    <meta name="description" content="Nexus รวมพื้นที่ทำงานส่วนตัวและเครื่องมือ: Nexus Main, Nexus Tools, DataLens, AlgoViz และ ScreenTutor" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus" />
    <title>Nexus — Preparing workspace…</title>
    <script>
      try {
        const savedTheme = JSON.parse(localStorage.getItem("nexus-app-settings") || "{}").state?.themeMode || "dark";
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = savedTheme === "dark" || (savedTheme === "system" && systemDark);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.classList.toggle("mono", savedTheme === "mono");
        // Keep in sync with themeColorFor() in src/utils/theme.ts.
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", savedTheme === "mono" ? "#fafafa" : isDark ? "#0c0b10" : "#f5f7f4");
      } catch { document.documentElement.classList.add("dark"); }
    </script>
    <style id="entry-shell-style">
      .entry-shell{min-height:100svh;background:#f5f7f4;color:#1e2a23;font-family:system-ui,"Leelawadee UI",Tahoma,sans-serif;padding:0 20px;display:flex;flex-direction:column}
      .entry-shell__header{min-height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce4dd;font-size:14px}
      .entry-shell__brand{font-size:29px;font-weight:800;letter-spacing:-.04em}.entry-shell__brand span{color:#2d6a4f}
      .entry-shell__body{width:100%;max-width:480px;margin:auto;padding:32px 24px;border:1px solid #dce4dd;border-radius:14px;background:#fff}
      .entry-shell h1{margin:0;font-size:40px;line-height:1.25;font-weight:650;letter-spacing:-.03em}.entry-shell p{margin:12px 0 0;color:#718077;font-size:15px}
    </style>
  </head>
  <body>
    <div id="root"><main class="entry-shell" aria-busy="true" data-entry-shell><header class="entry-shell__header"><div class="entry-shell__brand"><span data-entry-brand>nexus</span><span data-entry-mark>.</span></div><span data-entry-context>Private workspace hub</span></header><section class="entry-shell__body"><h1 data-entry-heading>Preparing your workspaces</h1><p data-entry-message>Loading your Nexus project hub…</p></section></main></div>
    <script>
      try {
        const pathname = window.location.pathname.replace(/\/+$/, "") || "/";
        const entry = pathname === "/screentutor"
          ? { title: "ScreenTutor — See. Understand. Learn.", brand: "ScreenTutor", mark: ".", context: "Local-first learning", heading: "See. Understand. Learn.", message: "Preparing your private workspace…" }
          : pathname === "/" || pathname === "/index.html" || pathname === "/projects" || pathname === "/projects/index.html"
            ? { title: "Nexus All — Projects", brand: "nexus", mark: ".", context: "Private workspace hub", lang: "th", heading: "Preparing your workspaces", message: "Loading your Nexus project hub…" }
            : pathname.startsWith("/algoviz")
              ? { title: "AlgoViz · Interactive Algorithm Lab", brand: "AlgoViz", mark: "", context: "Interactive algorithm lab", heading: "Preparing AlgoViz", message: "Loading the algorithm workspace…" }
              : { title: "Nexus Main — Workspace", brand: "nexus", mark: ".", context: "Private financial workspace", heading: "Preparing Nexus Main", message: "Checking your private workspace…" };
        document.title = entry.title;
        if (entry.lang) document.documentElement.lang = entry.lang;
        document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content", entry.brand === "ScreenTutor" ? "ScreenTutor" : "Nexus");
        document.querySelector("[data-entry-brand]")?.replaceChildren(document.createTextNode(entry.brand));
        document.querySelector("[data-entry-mark]")?.replaceChildren(document.createTextNode(entry.mark));
        document.querySelector("[data-entry-context]")?.replaceChildren(document.createTextNode(entry.context));
        document.querySelector("[data-entry-heading]")?.replaceChildren(document.createTextNode(entry.heading));
        document.querySelector("[data-entry-message]")?.replaceChildren(document.createTextNode(entry.message));
        const hasSavedSession = Object.keys(localStorage).some((key) => key.startsWith("sb-") && key.endsWith("-auth-token"));
        if (hasSavedSession) document.getElementById("root").replaceChildren();
      } catch { /* Keep the public shell when storage is unavailable. */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
