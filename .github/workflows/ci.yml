name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate production dependency SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-reproducible --validate --output-file nexus-npm-sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexus-npm-sbom
          path: nexus-npm-sbom.cdx.json
          retention-days: 90

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Unit / integration tests
        run: npm test

      - name: Build
        run: npm run build:release

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Account and cross-tab PIN regression
        run: npx playwright test --config=e2e/auth-entry.config.ts

      - name: Login accessibility and validation
        run: npx playwright test --config=e2e/login.config.ts

      - name: Nexus All layout and accessibility
        run: npx playwright test --config=e2e/project-hub.config.ts

      - name: Isolated performance budget
        run: npx playwright test e2e/release-readiness.spec.ts --grep "mobile constrained" --workers=1
        env:
          NEXUS_PERFORMANCE: "1"
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
